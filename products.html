<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | LUMINA Gaming Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        LUMINA<span>.</span>
    </a>

    <nav class="nav-links" id="navLinks">

        <a href="index.html">Home</a>

        <a href="products.html" class="active">
            Products
        </a>

        <a href="categories.html">
            Categories
        </a>

        <a href="deals.html">
            Deals
        </a>

        <a href="orders.html">
            Orders
        </a>

        <a href="cart.html" class="cart-link">
            🛒
            <span class="cart-count">0</span>
        </a>

        <a href="login.html" class="login-btn">
            Login
        </a>

    </nav>

    <button
        class="mobile-btn"
        onclick="toggleMenu()"
        aria-label="Open menu"
    >
        ☰
    </button>

</header>


<main class="page">

    <!-- PAGE HEADER -->

    <section class="page-header">

        <div>

            <span class="page-label">
                LUMINA COLLECTION
            </span>

            <h1>
                Gaming Products
            </h1>

            <p>
                Upgrade your gaming setup with premium gear.
            </p>

        </div>

    </section>


    <!-- SEARCH -->

    <section class="product-toolbar">

        <div class="search-box">

            <input
                type="text"
                id="productSearch"
                placeholder="Search products..."
                oninput="searchProducts()"
            >

            <button
                type="button"
                onclick="clearProductSearch()"
            >
                Clear
            </button>

        </div>


        <!-- FILTERS -->

        <div class="filter-buttons">

            <button
                type="button"
                class="filter-btn active"
                onclick="filterProducts('all', this)"
            >
                All
            </button>

            <button
                type="button"
                class="filter-btn"
                onclick="filterProducts('keyboard', this)"
            >
                Keyboards
            </button>

            <button
                type="button"
                class="filter-btn"
                onclick="filterProducts('mouse', this)"
            >
                Mouse
            </button>

            <button
                type="button"
                class="filter-btn"
                onclick="filterProducts('headset', this)"
            >
                Headsets
            </button>

            <button
                type="button"
                class="filter-btn"
                onclick="filterProducts('controller', this)"
            >
                Controllers
            </button>

            <button
                type="button"
                class="filter-btn"
                onclick="filterProducts('monitor', this)"
            >
                Monitors
            </button>

            <button
                type="button"
                class="filter-btn"
                onclick="filterProducts('accessory', this)"
            >
                Accessories
            </button>

        </div>

    </section>


    <!-- PRODUCTS -->

    <section>

        <div class="section-title">

            <h2>
                All Products
            </h2>

            <span>
                Premium Gaming Gear
            </span>

        </div>


        <!-- IMPORTANT: app.js uses this ID -->

        <div
            id="productsContainer"
            class="product-grid"
        ></div>

    </section>

</main>


<footer>

    © 2026
    <strong>LUMINA Gaming Store</strong>
    — All Rights Reserved.

</footer>


<script src="app.js"></script>

</body>
</html>
