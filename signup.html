<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Lumina</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<nav class="navbar">

    <a href="index.html" class="logo">
        🎮 <span>LUMINA</span><b>.</b>
        <small>GAMING STORE</small>
    </a>


    <div class="nav-links">

        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="categories.html">Categories</a>
        <a href="deals.html">Deals</a>

        <a href="cart.html">
            🛒 Cart
            <span class="cart-count">0</span>
        </a>

    </div>

</nav>


<div class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            🎮
        </div>

        <h1>Create Account</h1>

        <p>Join the Lumina gaming community.</p>


        <form onsubmit="signupUser(event)">

            <label>Name</label>

            <input
                type="text"
                id="signupName"
                placeholder="Your name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create password"
                required
            >


            <button class="btn primary full">
                Create Account
            </button>

        </form>


        <p class="auth-bottom">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
