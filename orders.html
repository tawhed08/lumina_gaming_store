<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | LUMINA Gaming Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <a href="index.html" class="logo">
        LUMINA<span>.</span>
    </a>

    <nav class="nav-links" id="navLinks">

        <a href="index.html">Home</a>

        <a href="products.html">Products</a>

        <a href="categories.html">Categories</a>

        <a href="deals.html">Deals</a>

        <a href="orders.html" class="active">Orders</a>

        <a href="cart.html" class="cart-link">
            🛒
            <span class="cart-count">0</span>
        </a>

        <a href="login.html" class="login-btn">
            Login
        </a>

    </nav>

    <button
        class="mobile-btn"
        onclick="toggleMenu()"
        aria-label="Open menu"
    >
        ☰
    </button>

</header>


<!-- ================= PAGE ================= -->

<main class="page orders-page">

    <!-- HEADER -->

    <section class="orders-hero">

        <div>

            <span class="page-label">
                ORDER HISTORY
            </span>

            <h1>
                My Orders
            </h1>

            <p>
                Track and manage all your LUMINA gaming purchases.
            </p>

        </div>

        <a
            href="products.html"
            class="continue-shopping"
        >
            Continue Shopping →
        </a>

    </section>


    <!-- ================= STATS ================= -->

    <section class="order-stats">

        <div class="order-stat">

            <div class="stat-icon">
                📦
            </div>

            <div>

                <span>Total Orders</span>

                <strong id="totalOrders">
                    0
                </strong>

            </div>

        </div>


        <div class="order-stat">

            <div class="stat-icon">
                🛍️
            </div>

            <div>

                <span>Items Purchased</span>

                <strong id="totalItems">
                    0
                </strong>

            </div>

        </div>


        <div class="order-stat">

            <div class="stat-icon">
                💰
            </div>

            <div>

                <span>Total Spent</span>

                <strong id="totalSpent">
                    $0.00
                </strong>

            </div>

        </div>

    </section>


    <!-- ================= ORDERS ================= -->

    <section class="orders-section">

        <div class="orders-section-header">

            <div>

                <span class="page-label">
                    PURCHASES
                </span>

                <h2>
                    Recent Orders
                </h2>

            </div>

            <a
                href="products.html"
                class="shop-more-btn"
            >
                Shop Now →
            </a>

        </div>


        <div id="ordersContainer">

            <!-- Orders will load here -->

        </div>

    </section>

</main>


<!-- ================= FOOTER ================= -->

<footer>

    © 2026
    <strong>LUMINA Gaming Store</strong>
    — All Rights Reserved.

</footer>


<script src="app.js"></script>

</body>
</html>
