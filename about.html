<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>About - LUMINA</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>


<body>

<main
    class="pt-32
    max-w-5xl
    mx-auto px-5
    pb-20">

    <p
        class="text-lime-400
        uppercase tracking-[4px]">

        About Us

    </p>


    <h1
        class="text-5xl
        font-black mt-3">

        About
        <span class="text-lime-400">
            Lumina
        </span>

    </h1>


    <p
        class="text-gray-400
        text-lg
        leading-8
        mt-8">

        Lumina is a modern gaming store
        built for gamers who want reliable,
        stylish and high-performance gaming
        equipment.

    </p>


    <div
        class="grid md:grid-cols-3
        gap-5 mt-10">

        <div class="card p-6 rounded-2xl">

            <i
                class="fa-solid fa-bolt
                text-lime-400 text-3xl">
            </i>

            <h2
                class="font-bold text-xl mt-4">

                Fast Performance

            </h2>

        </div>


        <div class="card p-6 rounded-2xl">

            <i
                class="fa-solid fa-shield
                text-lime-400 text-3xl">
            </i>

            <h2
                class="font-bold text-xl mt-4">

                Quality Gear

            </h2>

        </div>


        <div class="card p-6 rounded-2xl">

            <i
                class="fa-solid fa-gamepad
                text-lime-400 text-3xl">
            </i>

            <h2
                class="font-bold text-xl mt-4">

                Built For Gamers

            </h2>

        </div>

    </div>

</main>


<script src="components.js"></script>
<script src="app.js"></script>

</body>
</html>
